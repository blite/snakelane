name: Docs

# Versioned docs on GitHub Pages, published with mike to the gh-pages branch:
#   push to main  -> "dev"     (the docs for what main does now)
#   tag vX.Y.Z    -> "X.Y", and moves the "latest" alias (the site's default) to it
# One-time setup: Settings -> Pages -> Source: "Deploy from a branch", branch gh-pages, / (root).

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # mike commits to gh-pages

concurrency:
  group: docs
  cancel-in-progress: false   # two deploys racing on gh-pages would lose one

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: Configure git for mike
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages --depth=1 || true
      - name: Deploy dev (main)
        if: github.ref_type == 'branch'
        run: uv run --group docs mike deploy --push --update-aliases dev
      - name: Deploy release (tag)
        if: github.ref_type == 'tag'
        run: |
          version="${GITHUB_REF_NAME#v}"
          minor="${version%.*}"
          uv run --group docs mike deploy --push --update-aliases "$minor" latest
          uv run --group docs mike set-default --push latest
